name: PDFs

on:
  pull_request:
    branches: [ main ]
  push:
    tags: 
      - "*"
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    branches: [ main, dev ]
    
jobs:
  plugin:
    name: Compile PDF documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 
      - name: Setup typst
        uses: typst-community/setup-typst@v5
      - name: Compile manual
        run: typst compile manual.typ docs/manual.pdf
      #- name: Compile example
      #  run: typst compile docs/example/main.typ docs/example.pdf
      - name: Check for changes
        id: git-status
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push new PDFs
        if: steps.git-status.outputs.changed == 'true'
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          
          git add .
          git commit --amend --no-edit
          git push origin ${{ github.ref_name }} --force-with-lease